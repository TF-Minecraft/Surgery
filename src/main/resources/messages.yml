request-accepted-surgeon: "&a%patient% has agreed to the operation."
request-denied-patient: "&7You declined the operation."
request-denied-surgeon: "&c%patient% declined the operation."

# Item Errors
item-not-in-inventory: "&cYou don't have this instrument in your inventory!"

# Success/Failure Messages
surgery-successful: "&6Surgery Successful!"
