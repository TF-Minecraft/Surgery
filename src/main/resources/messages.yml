# Surgery Plugin - All Player Messages
# This file contains all text displayed to players

# Command Messages
command-usage: "&cUsage: /surgery <player> | accept | deny"
command-player-not-found: "&cPlayer not found or not online!"
command-too-far: "&cThe patient must be within %distance% blocks of you!"
