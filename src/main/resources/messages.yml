vision-cleared: "&aVision cleared! Skill fail chance reduced for next move."
condition-treated-incomplete: "&eThe ailment is dressed, but the surgery is not yet complete."
check-remaining: "&eCheck: bones, incisions, bleeding, temperature, status"
dressing-ready: "&aThe injury is set - apply the linen dressing!"

# Discovery Messages
discovered-broken-bone: "&eThe incision reveals a broken bone!"
discovered-shattered-bone: "&eThe incision reveals a shattered bone!"

# Tool Availability Messages
smelling-salts-available: "&cThe patient has collapsed - reach for the smelling salts!"
silver-wire-available: "&eSilver wire is ready to bind the shattered bone!"
splint-available: "&eA splint is ready to set the broken bone!"
artery-forceps-available: "&cArtery forceps are ready to stop the bleeding!"

# Status Change Messages
