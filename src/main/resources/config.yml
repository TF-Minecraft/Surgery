# Surgery Plugin Configuration
# Physicians operate on the healing ailments of RPCharacters characters
# (broken arm, broken leg, half blind, ...). Permanent injuries cannot be
# treated. A successful surgery cures the ailment; a failed one makes it take
# longer to heal.

# Permission needed to operate. The Physician profession upgrade grants it,
# the same permission that unlocks crafting the surgical tools
permission: "professions.physician"

# Healing time added to the ailment when a surgery fails after the patient
# was sedated or cut (d/h/m/s, e.g. "12h" or "1d 6h"; "0h" disables it)
failure-healing-penalty: "12h"

# How long a patient has to accept a surgery offer
request-timeout-seconds: 60

# Maximum distance in blocks between surgeon and patient to perform surgery
max-surgery-distance: 5.0

# During surgery the patient may drift up to max-surgery-distance times this
# multiplier before the surgery fails (patient left / logged off also fails)
patient-leave-distance-multiplier: 2.0

# ============================================
# PROCEDURES
# ============================================

# How each healing ailment is operated on, keyed by RPCharacters trait ID.
# The stethoscope examination reveals the procedure. Once required-incisions
# are made, the bones are exposed; after every bone is set, the linen dressing
# treats the ailment.
# Complications:
#   haemorrhage - the wound keeps reopening and bleeding
#   shock       - the patient may collapse under chloroform
#   sepsis      - the patient is feverish and the fever keeps climbing
procedures:
  broken_arm:
    name: "Fractured Arm"
    required-incisions: 2
    broken-bones: 2
    shattered-bones: 0
    complications: []
  broken_leg:
    name: "Compound Fracture of the Leg"
    required-incisions: 2
    broken-bones: 2
    shattered-bones: 1
    complications: [haemorrhage]
  half_blind:
    name: "Injured Eye"
    required-incisions: 1
    broken-bones: 0
    shattered-bones: 0
    complications: [shock, sepsis]

# Used for healing ailments with no procedure above
default-procedure:
  name: "Injury"
  required-incisions: 2
  broken-bones: 0
  shattered-bones: 0
  complications: []

# ============================================
# SKILL FAIL CHANCES
# ============================================

skill-fail:
  base-chance: 0.25                      # Base skill fail chance (0.0 = 0%, 1.0 = 100%)
  bleeding-chance: 0.40                  # Skill fail chance when patient is bleeding
  with-sponge-chance: 0.10               # Skill fail chance when sponge effect is active (reduced)

# ============================================
# TEMPERATURE SETTINGS
# ============================================

temperature:
  normal: 98.6                           # Normal starting temperature
  rising-temp-min: 98.6                  # Min for rising temp patients
  rising-temp-max: 104.0                 # Max for rising temp patients
  instant-death-threshold: 110.0         # Instant death above this
  red-temp-threshold: 106.0              # Red temp danger zone
  success-threshold: 100.0               # Must be <= this to succeed
  rise-rate: 1.8                         # Temp increase per move
  tincture-change: 5.4                   # ±F from the willow-bark tincture

# ============================================
# PULSE SETTINGS
# ============================================

pulse:
  degradation-chance-bleeding: 0.30      # 30% chance to degrade when bleeding
  scalpel-decrease-chance: 0.50          # 50% chance scalpel decreases pulse

# ============================================
# DEATH TIMERS
# ============================================

death-timers:
  collapse-countdown: 2                  # Moves until death after the patient collapses
  weak-pulse-turns: 2                    # Consecutive turns with Extremely Weak pulse
  red-temp-turns: 2                      # Consecutive turns with red temperature
  anesthetic-reuse-cooldown: 4           # Moves before chloroform can be given again

# ============================================
# CHLOROFORM WEAR-OFF
# ============================================

anesthetic:
  unconscious-moves: 6                   # Moves unconscious before patient starts coming to
  coming-to-moves: 2                     # Moves of "Coming to" before patient is fully awake

# ============================================
# COMPLICATIONS
# ============================================

complications:
  haemorrhage:
    bleeding-interval-min: 3             # Forces bleeding every 3-4 moves since the last sponge
    bleeding-interval-max: 4
  shock:
    collapse-chance: 0.20                # Chance per move to collapse while unconscious
  sepsis:
    fever-min: 100.0                     # Fever found by the examination
    fever-max: 104.0

# ============================================
# COMMANDS
# ============================================

# Commands to execute on surgery completion
# Use %surgeon% for the surgeon's name, %player% for the patient's name,
# and %ailment% for the ailment
# These are executed by the console
commands:
  surgery-success: "sudo %surgeon% me Successfully operated on %player%'s %ailment%!"
  surgery-failure: "sudo %surgeon% me Failed to mend %player%'s %ailment%!"
